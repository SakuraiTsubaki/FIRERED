name: Fetch mGBA

on:
  push:
    paths:
      - ".github/workflows/fetch-mgba.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official mGBA AppImage
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             -o mGBA-0.10.5-appimage-x64.appimage             https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-appimage-x64.appimage
          chmod +x mGBA-0.10.5-appimage-x64.appimage
          sha256sum mGBA-0.10.5-appimage-x64.appimage | tee SHA256SUMS.txt
      - name: Upload mGBA
        uses: actions/upload-artifact@v4
        with:
          name: mgba-0.10.5-linux-x64
          path: |
            mGBA-0.10.5-appimage-x64.appimage
            SHA256SUMS.txt
          if-no-files-found: error
